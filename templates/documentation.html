<!DOCTYPE html>
<html class="dark" lang="fr">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
        <title>M.A.E.L. - Documentation</title>

        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

        <script id="tailwind-config">
            tailwind.config = {
                darkMode: "class",
                theme: {
                    extend: {
                        colors: {
                            "outline-variant": "#4e4639",
                            "secondary-container": "#524343",
                            "on-primary": "#412d00",
                            "tertiary-fixed": "#e5e2dd",
                            "tertiary": "#c9c6c2",
                            "on-secondary": "#3a2d2d",
                            "on-surface": "#e5e2e1",
                            "outline": "#9a8f80",
                            "primary-fixed": "#ffdea5",
                            "on-primary-fixed": "#261900",
                            "surface-dim": "#131313",
                            "inverse-surface": "#e5e2e1",
                            "secondary": "#d6c2c1",
                            "on-secondary-fixed": "#241919",
                            "surface": "#131313",
                            "secondary-fixed": "#f3dedd",
                            "primary-container": "#c5a059",
                            "surface-container-lowest": "#0e0e0e",
                            "background": "#131313",
                            "primary-fixed-dim": "#e9c176",
                            "tertiary-fixed-dim": "#c9c6c2",
                            "surface-container": "#20201f",
                            "secondary-fixed-dim": "#d6c2c1",
                            "on-error": "#690005",
                            "error-container": "#93000a",
                            "error": "#ffb4ab",
                            "on-error-container": "#ffdad6",
                            "on-secondary-container": "#c4b1b0",
                            "surface-container-highest": "#353535",
                            "on-primary-fixed-variant": "#5d4201",
                            "surface-bright": "#393939",
                            "on-secondary-fixed-variant": "#524343",
                            "inverse-primary": "#775a19",
                            "on-primary-container": "#4e3700",
                            "surface-tint": "#e9c176",
                            "surface-container-high": "#2a2a2a",
                            "on-tertiary-container": "#3b3b38",
                            "surface-container-low": "#1c1b1b",
                            "on-surface-variant": "#d1c5b4",
                            "on-tertiary": "#31302d",
                            "tertiary-container": "#a7a5a1",
                            "on-background": "#e5e2e1",
                            "surface-variant": "#353535",
                            "on-tertiary-fixed-variant": "#474743",
                            "primary": "#e9c176",
                            "on-tertiary-fixed": "#1c1c19",
                            "inverse-on-surface": "#313030"
                        },
                        borderRadius: {
                            DEFAULT: "0.125rem",
                            lg: "0.25rem",
                            xl: "0.5rem",
                            full: "0.75rem"
                        },
                        spacing: {
                            unit: "8px",
                            "component-gap": "16px",
                            gutter: "24px",
                            "margin-safe": "32px"
                        },
                        fontFamily: {
                            "headline-md": ["Libre Caslon Text", "serif"],
                            "body-lg": ["Manrope", "sans-serif"],
                            "display-lg-mobile": ["Libre Caslon Text", "serif"],
                            "display-lg": ["Libre Caslon Text", "serif"],
                            "label-sm": ["Manrope", "sans-serif"],
                            "body-md": ["Manrope", "sans-serif"]
                        },
                        fontSize: {
                            "headline-md": ["24px", { lineHeight: "32px", fontWeight: "400" }],
                            "body-lg": ["18px", { lineHeight: "28px", fontWeight: "400" }],
                            "display-lg-mobile": ["32px", { lineHeight: "40px", fontWeight: "400" }],
                            "display-lg": ["48px", { lineHeight: "56px", letterSpacing: "-0.02em", fontWeight: "400" }],
                            "label-sm": ["12px", { lineHeight: "16px", letterSpacing: "0.08em", fontWeight: "600" }],
                            "body-md": ["16px", { lineHeight: "24px", fontWeight: "400" }]
                        }
                    }
                }
            }
        </script>

        <style>
            /* ---------- Top buttons ---------- */
            .back-btn {
                display: flex;
                align-items: center;
                gap: 8px;
                color: #d1c5b4;
                font-family: 'Manrope', sans-serif;
                font-size: 14px;
                font-weight: 600;
                text-decoration: none;
                padding: 8px;
                border-radius: 0.25rem;
                transition: color 0.2s, background-color 0.2s;
            }

            .back-btn:hover {
                color: #e9c176;
                background-color: rgba(233, 193, 118, 0.08);
            }

            .pdf-btn {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                font-family: 'Manrope', sans-serif;
                font-size: 13px;
                letter-spacing: 0.04em;
                font-weight: 600;
                color: #412d00;
                background-color: #e9c176;
                border-radius: 0.25rem;
                padding: 10px 18px;
                text-decoration: none;
                white-space: nowrap;
                transition: background-color 0.2s;
            }

            .pdf-btn:hover { background-color: #f0cc87; }
            .pdf-btn .material-symbols-outlined { font-size: 18px; }

            /* ---------- Rendu du markdown ---------- */
            .doc-content {
                font-family: 'Manrope', sans-serif;
                font-size: 16px;
                line-height: 26px;
                color: #d1c5b4;
            }

            .doc-content > *:first-child { margin-top: 0; }

            .doc-content h1 {
                font-family: 'Libre Caslon Text', serif;
                font-size: 32px;
                line-height: 40px;
                color: #e5e2e1;
                margin: 0 0 24px;
            }

            .doc-content h2 {
                font-family: 'Libre Caslon Text', serif;
                font-size: 26px;
                line-height: 34px;
                color: #e9c176;
                margin: 48px 0 16px;
                padding-bottom: 8px;
                border-bottom: 1px solid rgba(78, 70, 57, 0.5);
                scroll-margin-top: 24px;
            }

            .doc-content h3 {
                font-family: 'Libre Caslon Text', serif;
                font-size: 20px;
                line-height: 28px;
                color: #e5e2e1;
                margin: 32px 0 12px;
                scroll-margin-top: 24px;
            }

            .doc-content h4 {
                font-size: 12px;
                letter-spacing: 0.08em;
                font-weight: 600;
                text-transform: uppercase;
                color: #d1c5b4;
                margin: 24px 0 8px;
            }

            .doc-content p { margin: 0 0 16px; }
            .doc-content strong { color: #e5e2e1; font-weight: 600; }

            .doc-content a {
                color: #e9c176;
                text-decoration: underline;
                text-underline-offset: 3px;
                text-decoration-color: rgba(233, 193, 118, 0.4);
            }

            .doc-content a:hover { text-decoration-color: #e9c176; }

            .doc-content ul,
            .doc-content ol {
                margin: 0 0 16px;
                padding-left: 24px;
            }

            .doc-content ul { list-style: disc; }
            .doc-content ol { list-style: decimal; }
            .doc-content li { margin: 4px 0; }
            .doc-content li > ul,
            .doc-content li > ol { margin: 4px 0 0; }
            .doc-content li::marker { color: #9a8f80; }

            .doc-content img {
                display: block;
                max-width: 100%;
                height: auto;
                margin: 24px auto;
                border-radius: 0.5rem;
                border: 1px solid rgba(245, 242, 237, 0.08);
            }

            .doc-content blockquote {
                margin: 0 0 16px;
                padding: 12px 16px;
                background-color: rgba(233, 193, 118, 0.06);
                border-left: 3px solid #e9c176;
                border-radius: 0 0.25rem 0.25rem 0;
            }

            .doc-content blockquote p:last-child { margin-bottom: 0; }

            .doc-content code {
                font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
                font-size: 14px;
                color: #e9c176;
                background-color: #2a2a2a;
                padding: 2px 6px;
                border-radius: 0.25rem;
            }

            .doc-content pre {
                margin: 0 0 16px;
                padding: 16px;
                background-color: #0e0e0e;
                border: 1px solid rgba(78, 70, 57, 0.5);
                border-radius: 0.25rem;
                overflow-x: auto;
            }

            .doc-content pre code {
                padding: 0;
                background: none;
                color: #e5e2e1;
            }

            .doc-content table {
                width: 100%;
                border-collapse: collapse;
                margin: 0 0 16px;
                font-size: 14px;
                line-height: 20px;
                display: block;
                overflow-x: auto;
            }

            .doc-content th {
                text-align: left;
                font-size: 12px;
                letter-spacing: 0.08em;
                font-weight: 600;
                text-transform: uppercase;
                color: #e9c176;
                border-bottom: 1px solid rgba(233, 193, 118, 0.4);
            }

            .doc-content th,
            .doc-content td {
                padding: 10px 12px;
                vertical-align: top;
            }

            .doc-content td { border-bottom: 1px solid rgba(78, 70, 57, 0.35); }
            .doc-content tr:last-child td { border-bottom: none; }

            .doc-content hr {
                border: none;
                border-top: 1px solid rgba(78, 70, 57, 0.5);
                margin: 32px 0;
            }
        </style>
    </head>

    <body class="min-h-screen flex flex-col font-body-md text-body-md antialiased selection:bg-primary-container selection:text-on-primary-container">

        <div class="flex-1 flex flex-col">
            <main class="page-main" style="justify-content:flex-start;">

                <!-- Back button -->
                <div class="absolute top-8 left-6 md:top-margin-safe md:left-gutter">
                    <a href="{{ url_for('index') }}" class="back-btn">
                        <span class="material-symbols-outlined text-xl">arrow_back</span>
                        <span class="hidden sm:inline">Retour</span>
                    </a>
                </div>

                <!-- PDF button -->
                <div class="absolute top-8 right-6 md:top-margin-safe md:right-gutter">
                    <a href="{{ url_for('documentation_pdf') }}" class="pdf-btn" download>
                        <span class="material-symbols-outlined">picture_as_pdf</span>
                        <span class="hidden sm:inline">Télécharger en PDF</span>
                        <span class="sm:hidden">PDF</span>
                    </a>
                </div>

                <!-- Centered content -->
                <div class="flex flex-col items-center w-full mt-16">
                    <div class="w-full max-w-3xl">

                        <!-- Header -->
                        <div class="mb-8 text-center">
                            <h1 class="page-tagline mb-1">Aide</h1>
                            <h2 style="font-family:'Libre Caslon Text',serif;font-size:36px;line-height:44px;font-weight:400;color:#e5e2e1;">
                                Documentation
                            </h2>
                        </div>

                        <!-- Card -->
                        <article class="doc-content" style="background-color:#1c1b1b;border:1px solid rgba(245,242,237,0.08);border-radius:0.5rem;padding:2rem;box-shadow:0 4px 16px rgba(0,0,0,0.45),0 1px 4px rgba(0,0,0,0.3);">
                            {{ contenu | safe }}
                        </article>

                    </div>
                </div>

            </main>
        </div>

    </body>
</html>
