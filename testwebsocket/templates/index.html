<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>WebSocket Test</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        body {
            font-family: monospace;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: #1e1e1e;
            color: #d4d4d4;
        }
        h1 {
            color: #4ec9b0;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .panel {
            border: 2px solid #444;
            padding: 15px;
            background: #252526;
            border-radius: 5px;
        }
        .panel h2 {
            margin-top: 0;
            color: #4ec9b0;
            font-size: 14px;
            text-transform: uppercase;
        }
        #log {
            height: 300px;
            overflow-y: auto;
            background: #1e1e1e;
            border: 1px solid #333;
            padding: 10px;
            margin-bottom: 10px;
            font-size: 12px;
            line-height: 1.4;
        }
        .log-entry {
            margin: 5px 0;
            padding: 3px;
        }
        .connect { color: #4ec9b0; }
        .disconnect { color: #f48771; }
        .received { color: #b4cea8; }
        .sent { color: #9cdcfe; }
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0;
            background: #3c3c3c;
            border: 1px solid #555;
            color: #d4d4d4;
            font-family: monospace;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            background: #007acc;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #005a9e;
        }
        #status {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 3px;
            font-weight: bold;
        }
        .connected {
            background: #4ec9b0;
            color: #1e1e1e;
        }
        .disconnected {
            background: #f48771;
            color: #1e1e1e;
        }
    </style>
</head>
<body>
    <h1>♟ WebSocket Test</h1>
    
    <div id="status" class="disconnected">🔴 Déconnecté</div>
    
    <div class="container">
        <!-- Panneau Réception -->
        <div class="panel">
            <h2>📨 Reçu du serveur</h2>
            <div id="log"></div>
            <button onclick="clearLog()">Effacer log</button>
        </div>
        
        <!-- Panneau Envoi -->
        <div class="panel">
            <h2>📤 Envoyer un message</h2>
            
            <h3 style="color: #9cdcfe; font-size: 12px;">Message simple:</h3>
            <input type="text" id="messageInput" placeholder="Écris quelque chose...">
            <button onclick="sendMessage()">Envoyer message</button>
            
            <h3 style="color: #9cdcfe; font-size: 12px;">Coup (format: e2e4):</h3>
            <input type="text" id="moveInput" placeholder="Ex: e2e4">
            <button onclick="sendMove()">Envoyer coup</button>
            
            <h3 style="color: #9cdcfe; font-size: 12px;">JSON personnalisé:</h3>
            <input type="text" id="jsonInput" placeholder='{"type":"custom","data":"..."}'>
            <button onclick="sendJSON()">Envoyer JSON</button>
        </div>
    </div>

    <script>
        // Connexion WebSocket
        const socket = io('http://localhost:5000');
        
        socket.on('connect', () => {
            console.log('✓ Connecté');
            updateStatus(true);
            addLog('connect', '✓ Connecté au serveur');
        });
        
        socket.on('disconnect', () => {
            console.log('✗ Déconnecté');
            updateStatus(false);
            addLog('disconnect', '✗ Déconnecté du serveur');
        });
        
        socket.on('log', (data) => {
            addLog('received', data.text);
        });
        
        socket.on('response', (data) => {
            addLog('received', '↩️ Réponse: ' + JSON.stringify(data));
        });
        
        // Envoyer un message simple
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const msg = input.value.trim();
            if (!msg) return;
            
            socket.emit('message', msg);
            addLog('sent', '→ Message: ' + msg);
            input.value = '';
        }
        
        // Envoyer un coup
        function sendMove() {
            const input = document.getElementById('moveInput');
            const move = input.value.trim();
            if (!move) return;
            
            socket.emit('move', { move: move });
            addLog('sent', '→ Coup: ' + move);
            input.value = '';
        }
        
        // Envoyer JSON personnalisé
        function sendJSON() {
            const input = document.getElementById('jsonInput');
            const jsonStr = input.value.trim();
            if (!jsonStr) return;
            
            try {
                const data = JSON.parse(jsonStr);
                socket.emit('message', data);
                addLog('sent', '→ JSON: ' + JSON.stringify(data));
                input.value = '';
            } catch (e) {
                addLog('error', '❌ JSON invalide: ' + e.message);
            }
        }
        
        // Ajoute une ligne au log
        function addLog(type, text) {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = 'log-entry ' + type;
            entry.textContent = text;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight; // Auto-scroll
        }
        
        // Efface le log
        function clearLog() {
            document.getElementById('log').innerHTML = '';
        }
        
        // Met à jour le statut
        function updateStatus(connected) {
            const status = document.getElementById('status');
            if (connected) {
                status.textContent = '🟢 Connecté';
                status.className = 'connected';
            } else {
                status.textContent = '🔴 Déconnecté';
                status.className = 'disconnected';
            }
        }
        
        // Permet d'appuyer sur Entrée pour envoyer
        document.getElementById('messageInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
        document.getElementById('moveInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMove();
        });
        document.getElementById('jsonInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendJSON();
        });
    </script>
</body>
</html>
